
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Queue Simulator</h1>
        <p>First In, First Out (FIFO)</p>

        <div class="controls">
            <input type="text" id="queueInput"
                placeholder="Enter a value">

            <button id="enqueueBtn">Enqueue</button>
            <button id="dequeueBtn">Dequeue</button>
            <button id="peekBtn">Peek</button>
            <button id="clearBtn">Clear</button>
        </div>

        <h2>Operations</h2>
        <p id="message">Ready to use Queue Simulator.</p>

        <h2>Queue Data</h2>
        <p>Front → Rear</p>
        <div id="queue" class="stack"></div>

        <h2>Deleted from Queue</h2>
        <div id="deleted" class="deleted"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="queue.js"></script>

</body>
</html>
